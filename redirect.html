<style>
  :root{
    --ink:#1A1510;
    --gold:#B08A4E;
    --gold-light:#D8B77E;
    --line-dark:#3B3225;
    --muted-dark:#B9AC97;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    background:var(--ink);color:#fff;
    font-family:'Inter',system-ui,sans-serif;
    padding:24px;
  }
  .card{
    max-width:440px;width:100%;text-align:center;
    border:1px solid var(--line-dark);padding:52px 38px;
    background:rgba(255,255,255,.015);
  }
  .brand{
    display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:32px;
  }
  .brand-mark{font-family:'Playfair Display';font-weight:700;font-size:24px;color:#fff;}
  .brand-divider{width:1px;height:20px;background:#fff;opacity:.35;}
  .brand-name{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted-dark);}
  h1{
    font-family:'Playfair Display';font-weight:600;font-size:22px;
    margin:0 0 14px;color:#fff;
  }
  p{font-size:14.5px;color:var(--muted-dark);margin:0 0 32px;line-height:1.6;}
  .spinner{
    width:34px;height:34px;border-radius:50%;
    border:2.5px solid var(--line-dark);border-top-color:var(--gold-light);
    margin:0 auto 28px;animation:spin 0.9s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .count{font-family:'Playfair Display';font-style:italic;font-size:14px;color:var(--gold-light);margin-bottom:26px;}
  .fallback{
    display:inline-block;font-size:12.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:#fff;
    border:1px solid var(--line-dark);padding:13px 24px;transition:border-color .25s,color .25s;
  }
  .fallback:hover{border-color:var(--gold-light);color:var(--gold-light);}
</style>
</head>

    <h1>Encaminhando sua solicitação</h1>
    <p>Você será direcionado ao WhatsApp do escritório Garcia Rodrigues Advogados Associados em instantes.</p>
    <div class="count" id="count">Redirecionando em 3s</div>
    <a class="fallback" id="fallbackLink" href="#">Ir para o WhatsApp agora</a>
  </div>

  <script>
    const p = new URLSearchParams(window.location.search);
    const nome = p.get('nome') || '';
    const telefone = p.get('telefone') || '';
    const numero = p.get('numero') || '5551999999999';

    const mensagem = (nome && telefone)
      ? `Olá, meu nome é ${nome}. Meu telefone para contato é ${telefone}. Gostaria de falar com o escritório Garcia Rodrigues Advogados Associados.`
      : `Olá, gostaria de falar com o escritório Garcia Rodrigues Advogados Associados.`;
    const waUrl = `https://wa.me/${numero}?text=${encodeURIComponent(mensagem)}`;

    document.getElementById('fallbackLink').href = waUrl;

    let seconds = 3;
    const countEl = document.getElementById('count');
    const timer = setInterval(()=>{
      seconds -= 1;
      if(seconds > 0){
        countEl.textContent = `Redirecionando em ${seconds}s`;
      } else {
        clearInterval(timer);
        countEl.textContent = 'Redirecionando...';
        window.location.href = waUrl;
      }
    }, 1000);
  </script>
